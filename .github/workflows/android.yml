name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate schedule JSON
        run: python3 scripts/validate_schedule.py data/schedule.json

      - name: Unit tests, lint and debug APK
        run: >-
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
          -PRT521_SCHEDULE_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/data/schedule.json"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RT521-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
