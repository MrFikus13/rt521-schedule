name: Validate schedule JSON

on:
  push:
    paths:
      - "data/schedule.json"
      - "data/schedule.schema.json"
      - "scripts/validate_schedule.py"
      - ".github/workflows/validate-schedule.yml"
  pull_request:
    paths:
      - "data/schedule.json"
      - "data/schedule.schema.json"
      - "scripts/validate_schedule.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_schedule.py data/schedule.json
